<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="heroTitle heroDesc">
<title id="heroTitle">Journey — complete series map</title>
<desc id="heroDesc">An atmospheric ultrawide reader map showing the Journey network from Alder and Mile 24 through Fenwick, Rill, the High Pass, Kerr River, Zero House, and the far-side communities.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b201b"/>
    <stop offset=".5" stop-color="#15352f"/>
    <stop offset="1" stop-color="#0f2924"/>
  </linearGradient>
  <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#061713" stop-opacity=".84"/>
    <stop offset=".25" stop-color="#071b17" stop-opacity=".62"/>
    <stop offset=".48" stop-color="#0a211c" stop-opacity=".24"/>
    <stop offset=".72" stop-color="#0a211c" stop-opacity=".08"/>
    <stop offset="1" stop-color="#0a211c" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#081c18" stop-opacity="0"/>
    <stop offset=".65" stop-color="#081c18" stop-opacity=".06"/>
    <stop offset="1" stop-color="#061713" stop-opacity=".45"/>
  </linearGradient>
  <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
    <path d="M56 0H0V56" fill="none" stroke="#eadfc9" stroke-opacity=".035" stroke-width="1"/>
  </pattern>
  <filter id="noise" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="18"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .085"/></feComponentTransfer>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="2400" height="900" fill="url(#bg)"/>
<rect width="2400" height="900" fill="url(#grid)"/>

<!-- topographic texture -->
<g fill="none" stroke="#d9c7a8" stroke-opacity=".07" stroke-width="1.4">
  <path d="M-120 95 C190 18 420 155 690 79 S1180 154 1510 86 S2070 140 2510 44"/>
  <path d="M-100 155 C220 78 430 215 700 139 S1190 214 1520 146 S2080 200 2520 104"/>
  <path d="M-80 226 C240 149 460 286 730 210 S1220 285 1550 217 S2110 271 2550 175"/>
  <path d="M-65 305 C255 228 475 365 745 289 S1235 364 1565 296 S2125 350 2565 254"/>
  <path d="M-60 398 C260 321 480 458 750 382 S1240 457 1570 389 S2130 443 2570 347"/>
  <path d="M-75 505 C245 428 465 565 735 489 S1225 564 1555 496 S2115 550 2555 454"/>
  <path d="M-100 625 C220 548 440 685 710 609 S1200 684 1530 616 S2090 670 2530 574"/>
  <path d="M-135 760 C185 683 405 820 675 744 S1165 819 1495 751 S2055 805 2495 709"/>
</g>

<!-- landscape bands -->
<path d="M775 530 C920 420 1035 392 1185 367 C1330 343 1410 275 1510 172" fill="none" stroke="#71806f" stroke-opacity=".075" stroke-width="118" stroke-linecap="round"/>
<path d="M1490 148 L1528 87 L1567 148 Z M1570 178 L1606 118 L1645 178 Z M1665 210 L1705 145 L1748 210 Z" fill="#d9c7a8" fill-opacity=".06"/>

<!-- Kerr river -->
<path d="M2370 285 C2190 308 2078 350 1955 403 C1830 458 1740 510 1620 615 C1545 681 1468 734 1358 800" fill="none" stroke="#6d96a3" stroke-opacity=".16" stroke-width="54" stroke-linecap="round"/>
<path d="M2370 285 C2190 308 2078 350 1955 403 C1830 458 1740 510 1620 615 C1545 681 1468 734 1358 800" fill="none" stroke="#a8c6ca" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>

<!-- road network -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".72">
  <!-- current/shared south corridor -->
  <path d="M120 674 Q215 636 305 596 Q395 558 480 527 Q575 498 675 455" stroke="#86b1a5" stroke-width="7"/>
  <!-- historic north line -->
  <path d="M675 455 Q782 419 880 372 Q980 325 1085 284 Q1190 240 1310 202" stroke="#d58a58" stroke-width="6" stroke-dasharray="16 12"/>
  <!-- Rill branch -->
  <path d="M675 455 Q690 530 770 592 Q846 647 944 662" stroke="#86b1a5" stroke-width="7"/>
  <!-- Cedar branch -->
  <path d="M944 662 Q1040 714 1115 778" stroke="#d58a58" stroke-width="6" stroke-dasharray="16 12"/>
  <!-- Mountain to high pass -->
  <path d="M1085 284 Q1215 246 1340 199 Q1458 156 1570 121" stroke="#78a5b5" stroke-width="6" stroke-dasharray="26 14"/>
  <!-- far side current -->
  <path d="M1570 121 Q1718 154 1828 216 Q1935 278 2025 370" stroke="#86b1a5" stroke-width="7"/>
  <!-- Hollis to Linden to Zero House -->
  <path d="M2025 370 Q2070 445 2052 518 Q2034 584 1945 630 Q1850 679 1720 690" stroke="#86b1a5" stroke-width="7"/>
  <!-- high pass to Zero House historic/field -->
  <path d="M1310 202 Q1440 330 1535 473 Q1625 606 1720 690" stroke="#d58a58" stroke-width="6" stroke-dasharray="16 12"/>
  <!-- Kerr limited span -->
  <path d="M1085 284 Q1280 446 1475 641 Q1588 744 1720 690" stroke="#d5b06f" stroke-width="6" stroke-dasharray="12 8 3 8"/>
  <!-- Zero House western route -->
  <path d="M1720 690 Q1510 694 1290 632 Q1110 582 944 662" stroke="#d58a58" stroke-width="5" stroke-dasharray="16 12"/>
  <!-- Zero House to Grey Vale controlled -->
  <path d="M1720 690 Q1915 728 2145 744" stroke="#aa849f" stroke-width="6" stroke-dasharray="4 12"/>
  <!-- Zero House east outer route -->
  <path d="M1720 690 Q1955 650 2225 630" stroke="#d58a58" stroke-width="5" stroke-dasharray="16 12"/>
  <!-- long modern return circuit -->
  <path d="M1570 121 C1880 24 2245 128 2025 370" stroke="#86b1a5" stroke-width="5" stroke-opacity=".66"/>
</g>

<!-- map points -->
<g font-family="Arial,Helvetica,sans-serif" font-weight="800" letter-spacing="1.1" fill="#e8dfcf" opacity=".62">
  <g transform="translate(120 674)"><circle r="6" fill="#d8e5df"/><text x="14" y="-12" font-size="12">ALDER</text></g>
  <g transform="translate(305 596)"><circle r="15" fill="none" stroke="#e2d8c7" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-size="12">23</text><text x="24" y="5" font-size="11">MILE 23</text></g>
  <g transform="translate(480 527)"><circle r="15" fill="none" stroke="#e2d8c7" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-size="12">24</text><text x="24" y="5" font-size="11">MILE 24</text></g>
  <g transform="translate(675 455)"><circle r="6" fill="#d8e5df"/><text x="15" y="-12" font-size="12">FENWICK</text></g>
  <g transform="translate(880 372)"><circle r="6" fill="#d8e5df"/><text x="15" y="-12" font-size="12">BLACKWOOD</text></g>
  <g transform="translate(1085 284)"><circle r="6" fill="#d8e5df"/><text x="15" y="-12" font-size="12">MOUNTAIN MILE</text></g>
  <g transform="translate(944 662)"><circle r="6" fill="#d8e5df"/><text x="15" y="-12" font-size="12">RILL</text></g>
  <g transform="translate(1115 778)"><circle r="6" fill="#d8e5df"/><text x="15" y="-12" font-size="12">CEDAR BRANCH</text></g>
  <g transform="translate(1340 199)"><circle r="6" fill="#d8e5df"/><text x="15" y="-12" font-size="12">HIGH PASS</text></g>
  <g transform="translate(1570 121)"><circle r="6" fill="#d8e5df"/><text x="15" y="-12" font-size="12">CRESTON</text></g>
  <g transform="translate(1828 216)"><circle r="6" fill="#d8e5df"/><text x="15" y="-12" font-size="12">HOLLIS</text></g>
  <g transform="translate(2052 518)"><circle r="6" fill="#d8e5df"/><text x="15" y="-12" font-size="12">LINDEN</text></g>
  <g transform="translate(1720 690)" filter="url(#softGlow)"><circle r="24" fill="#112e28" stroke="#dec79e" stroke-width="2.5"/><text x="0" y="6" text-anchor="middle" font-size="17" fill="#f1e5d2">0</text><text x="35" y="-12" font-size="13" fill="#f1e5d2">ZERO HOUSE</text></g>
  <g transform="translate(2145 744)"><circle r="6" fill="#d8e5df"/><text x="15" y="-12" font-size="12">GREY VALE</text></g>
</g>

<!-- small bridge marks -->
<g opacity=".42" stroke="#c8d9dc" fill="none" stroke-width="2">
  <path d="M525 504 h34 M530 500 q12-17 24 0"/>
  <path d="M1464 631 h38 M1470 627 q13-18 26 0"/>
</g>

<!-- route labels -->
<g font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="800" letter-spacing="1.6" fill="#d7ccba" opacity=".32">
  <text x="555" y="490">NORTH LINK</text>
  <text x="1186" y="224">SEASONAL HIGH ROUTE</text>
  <text x="1458" y="605">KERR LIMITED SPAN</text>
  <text x="1750" y="660">REGIONAL TRANSFER NETWORK</text>
</g>

<!-- overall dim and editorial overlays -->
<rect width="2400" height="900" fill="#071a16" fill-opacity=".12"/>
<rect width="2400" height="900" fill="url(#leftShade)"/>
<rect width="2400" height="900" fill="url(#bottomShade)"/>
<rect width="2400" height="900" filter="url(#noise)" opacity=".72"/>
<path d="M720 -40 L1075 940" stroke="#c66e38" stroke-opacity=".06" stroke-width="2"/>
<path d="M786 -40 L1140 940" stroke="#eee0c6" stroke-opacity=".025" stroke-width="1"/>
</svg>
